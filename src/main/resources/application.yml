spring:
  application:
    name: backend-turnos

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}
  # Production TLS terminates at the trusted ingress/reverse proxy; trust forwarded headers
  # only when the service is reachable exclusively through that proxy/private network.
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8

app:
  time-zone: ${APP_TIME_ZONE:UTC}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  reservation:
    reconciliation:
      enabled: ${APP_RESERVATION_RECONCILIATION_ENABLED:true}
      initial-delay-ms: ${APP_RESERVATION_RECONCILIATION_INITIAL_DELAY_MS:30000}
      fixed-delay-ms: ${APP_RESERVATION_RECONCILIATION_FIXED_DELAY_MS:300000}
      retry-backoff-ms: ${APP_RESERVATION_RECONCILIATION_RETRY_BACKOFF_MS:60000}
      batch-size: ${APP_RESERVATION_RECONCILIATION_BATCH_SIZE:50}
      page-size: ${APP_RESERVATION_RECONCILIATION_PAGE_SIZE:100}
      max-pages: ${APP_RESERVATION_RECONCILIATION_MAX_PAGES:10}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiry-seconds: ${APP_JWT_EXPIRY_SECONDS:86400}
    remember-me-expiry-seconds: ${APP_JWT_REMEMBER_ME_EXPIRY_SECONDS:604800}
  auth:
    introspection:
      client-id: ${APP_AUTH_INTROSPECTION_CLIENT_ID}
      client-secret: ${APP_AUTH_INTROSPECTION_CLIENT_SECRET}
  kafka:
    listener:
      # Re-fetch the assigned integration and recover a stopped consumer at a bounded cadence.
      recovery-initial-delay-ms: ${APP_KAFKA_LISTENER_RECOVERY_INITIAL_DELAY_MS:30000}
      recovery-fixed-delay-ms: ${APP_KAFKA_LISTENER_RECOVERY_FIXED_DELAY_MS:30000}

catedra:
  api:
    base-url: ${CATEDRA_API_BASE_URL}
    login: ${CATEDRA_LOGIN:}
    password: ${CATEDRA_PASSWORD:}
    jwt: ${CATEDRA_JWT:}
  http:
    connect-timeout-ms: ${CATEDRA_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATEDRA_HTTP_READ_TIMEOUT_MS}
  retry:
    max-attempts: ${CATEDRA_RETRY_MAX_ATTEMPTS}
    initial-backoff-ms: ${CATEDRA_RETRY_INITIAL_BACKOFF_MS}
    max-backoff-ms: ${CATEDRA_RETRY_MAX_BACKOFF_MS}

catalog:
  api:
    base-url: ${CATALOGO_API_BASE_URL}
    connect-timeout-ms: ${CATALOGO_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATALOGO_HTTP_READ_TIMEOUT_MS}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"
  level:
    root: INFO
    ar.edu.um.turnos: INFO
