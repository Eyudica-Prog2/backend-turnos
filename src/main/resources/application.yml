spring:
  application:
    name: backend-turnos

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8

app:
  time-zone: ${APP_TIME_ZONE:UTC}
  jwt:
    # Must match the key used by backend-catalogo to issue user tokens.
    secret: ${APP_JWT_SECRET}

catedra:
  api:
    base-url: ${CATEDRA_API_BASE_URL}
    login: ${CATEDRA_LOGIN:}
    password: ${CATEDRA_PASSWORD:}
    jwt: ${CATEDRA_JWT:}
  http:
    connect-timeout-ms: ${CATEDRA_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATEDRA_HTTP_READ_TIMEOUT_MS}
  retry:
    max-attempts: ${CATEDRA_RETRY_MAX_ATTEMPTS}
    initial-backoff-ms: ${CATEDRA_RETRY_INITIAL_BACKOFF_MS}
    max-backoff-ms: ${CATEDRA_RETRY_MAX_BACKOFF_MS}

catalog:
  api:
    base-url: ${CATALOGO_API_BASE_URL}
    connect-timeout-ms: ${CATALOGO_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATALOGO_HTTP_READ_TIMEOUT_MS}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"
  level:
    root: INFO
    ar.edu.um.turnos: INFO
